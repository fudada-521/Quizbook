[package]
name = "gaoxiang-quiz"
version = "1.0.0"
description = "知题 - 桌面答题应用"
authors = ["fukun"]
edition = "2021"

[lib]
name = "gaoxiang_quiz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
